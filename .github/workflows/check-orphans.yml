name: Check Orphaned Packages

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply removals (unchecked previews the plan)'
        type: boolean
        default: false

concurrency:
  group: x86_64-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-orphans:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check for Unreferenced Packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY_REMOVALS: ${{ inputs.apply }}
        run: bash scripts/release.sh prune "$APPLY_REMOVALS"
