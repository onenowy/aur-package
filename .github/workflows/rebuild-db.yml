name: Rebuild Repository Database

on:
  workflow_dispatch:

concurrency:
  group: x86_64-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rebuild:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Rebuild and Publish Database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release.sh rebuild
