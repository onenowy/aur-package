name: Arch Package CI/CD

on:
  schedule:
    # Run daily at 07:00 and 19:00 UTC
    - cron: '0 7,19 * * *'
  workflow_dispatch:
    inputs:
      check_for_updates:
        description: 'Check upstream updates? (Uncheck to build ALL packages as-is)'
        required: false
        default: false
        type: boolean

concurrency:
  group: x86_64-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-and-build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Dependencies
        run: sudo apt-get install -y python3-pip jq && pip install 'nvchecker[rpmrepo,jq]'

      - name: Fetch Published Database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release.sh fetch

      - name: Check for Updates
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./scripts/update-version.sh

          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.check_for_updates }}" == "true" ]]; then
            mkdir -p "$RUNNER_TEMP/arch-tools"
            cat > "$RUNNER_TEMP/arch-tools/vercmp" <<'SH'
          #!/bin/bash
          exec docker run --rm archlinux:base-devel /usr/bin/vercmp "$@"
          SH
            chmod +x "$RUNNER_TEMP/arch-tools/vercmp"
            db=
            if [[ $(cat release_dist/release.json) != null ]]; then
              db=release_dist/shelter-arch-aur.db.tar.gz
            fi
            PATH="$RUNNER_TEMP/arch-tools:$PATH" ./scripts/update-version.sh "$db"
          else
            echo "Manual build mode: Building ALL packages found."
            ALL_PKGS=$(find . -mindepth 2 -maxdepth 2 -type f -name PKGBUILD -not -path './.*' -not -path './unused/*' -printf '%h\n' | sed 's|^./||' | jq -R . | jq -s -c .)
            
            echo "Detected packages: $ALL_PKGS"
            echo "BUILD_REQUIRED=true" >> "$GITHUB_OUTPUT"
            echo "BUILD_PACKAGES=$ALL_PKGS" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Packages
        if: steps.check.outputs.BUILD_REQUIRED == 'true'
        uses: docker://archlinux:base-devel
        env:
          PACKAGES: ${{ steps.check.outputs.BUILD_PACKAGES }}
        with:
          args: /bin/bash /github/workspace/scripts/build_script.sh

      - name: Fix Permissions
        if: steps.check.outputs.BUILD_REQUIRED == 'true'
        run: sudo chown -R $USER:$USER .

      - name: Build Repository Database
        if: steps.check.outputs.BUILD_REQUIRED == 'true'
        id: database
        env:
          MANUAL_BUILD: ${{ github.event_name == 'workflow_dispatch' && !inputs.check_for_updates }}
        run: |
          shopt -s nullglob
          if [[ "$MANUAL_BUILD" == true && -f release_dist/assets.json ]]; then
            for package in release_dist/*.pkg.tar.zst; do
              if jq -e --arg name "${package##*/}" 'any(.[]; .name == $name)' release_dist/assets.json > /dev/null; then
                echo "Already published: ${package##*/}"
                rm -- "$package"
              fi
            done
          fi
          packages=(release_dist/*.pkg.tar.zst)
          if (( ${#packages[@]} == 0 )); then
            echo "No new package versions to publish."
            exit 0
          fi
          docker run --rm -v "$PWD:/repo" -w /repo/release_dist archlinux:base-devel bash /repo/scripts/manage-db.sh update
          echo 'publish=true' >> "$GITHUB_OUTPUT"

      - name: Commit Changes
        if: steps.database.outputs.publish == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "update: packages updated"
          file_pattern: '*/PKGBUILD */.SRCINFO'

      - name: Publish Packages and Database
        if: steps.database.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release.sh publish
