["obsidian.md"]
source = "jq"
url = "https://api.github.com/repos/obsidianmd/obsidian-releases/releases"
filter = '.[] | select(.draft == false and .prerelease == false) | .tag_name as $tag | select(any(.assets[]; .name == ("obsidian-" + ($tag | ltrimstr("v")) + ".tar.gz"))) | $tag'
prefix = "v"

[antigravity]
source = "jq"
url = "https://antigravity-hub-auto-updater-974169037036.us-central1.run.app/releases"
filter = '.[].version'

[claude-desktop]
source = "apt"
pkg = "claude-desktop"
mirror = "https://downloads.claude.ai/claude-desktop/apt/stable"
suite = "stable"
repo = "main"
arch = "amd64"

