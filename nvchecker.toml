[obsidian.md]
source = "github"
github = "obsidianmd/obsidian-releases"
use_latest_release = true
prefix = "v"

[antigravity]
source = "regex"
url = "https://antigravity.google/changelog"
regex = 'href="/releases\?tab=hub&amp;version=([\d\.]+)"'

[claude-desktop]
source = "apt"
pkg = "claude-desktop"
mirror = "https://downloads.claude.ai/claude-desktop/apt/stable"
suite = "stable"
repo = "main"
arch = "amd64"

[chatgpt]
source = "rpmrepo"
repo = "https://persistent.oaistatic.com/codex-app-prod/linux/rpm/x86_64"
pkg = "chatgpt"
arch = "x86_64"

